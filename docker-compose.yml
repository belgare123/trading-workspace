services:
  # ── Backend: FastAPI ──
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    image: trading-workspace-backend:latest
    container_name: tw-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - tw_data:/app/data
      - tw_logs:/app/logs
    ports:
      - "9121:9121"
    healthcheck:
      test: ["CMD-SHELL", "python -u -c \"import urllib.request; print(urllib.request.urlopen('http://localhost:9121/api/v1/system/health').status)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend: Vite SPA (nginx) ──
  frontend:
    build:
      context: workspace-ui
      dockerfile: Dockerfile
    image: trading-workspace-frontend:latest
    container_name: tw-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:9121

volumes:
  tw_data:
  tw_logs:
